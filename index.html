<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美股选股助手 · 单股诊断 + 估值分析</title>
<style>
:root{
  --bg:#0e1117; --card:#161b22; --card2:#1c2128; --border:#2d333b;
  --txt:#e6edf3; --dim:#8b949e; --green:#3fb950; --red:#f85149; --yellow:#d29922; --blue:#58a6ff;
  --good:#1f6feb; --bad:#da3633; --warn:#9e6a03;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px;max-width:1080px;margin:0 auto;line-height:1.5}
h1{font-size:20px;margin-bottom:4px}
.sub{color:var(--dim);font-size:13px;margin-bottom:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input[type=text]{flex:1;min-width:180px;background:var(--card2);border:1px solid var(--border);color:var(--txt);padding:9px 12px;border-radius:6px;font-size:15px}
input[type=text]:focus{outline:none;border-color:var(--blue)}
button{background:#1f6feb;color:#fff;border:none;padding:9px 16px;border-radius:6px;font-size:14px;cursor:pointer;font-weight:600}
button:hover{filter:brightness(1.1)}
button.sec{background:var(--card2);border:1px solid var(--border);color:var(--txt);font-weight:400}
select{background:var(--card2);border:1px solid var(--border);color:var(--txt);padding:9px 10px;border-radius:6px;font-size:14px;max-width:180px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin-bottom:12px}
.card h2 .ic{margin-right:6px}
.hidden{display:none}
.err{background:rgba(218,54,51,.15);border:1px solid var(--bad);color:#ff7b72;padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13px}
.loading{color:var(--dim);font-size:13px;padding:20px 0;text-align:center}
/* 行情概览 */
.q-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.q-name{font-size:18px;font-weight:700}
.q-code{color:var(--dim);font-size:13px}
.q-price{font-size:28px;font-weight:700}
.q-chg{font-size:15px;font-weight:600}
.up{color:var(--red)}   /* 美股页面沿用 A股习惯：红涨 */
.down{color:var(--green)} /* 绿跌 */
.q-meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--dim);font-size:13px;margin-top:8px}
.q-meta b{color:var(--txt);font-weight:600}
/* 指标网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.metric{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.metric .k{color:var(--dim);font-size:12px}
.metric .v{font-size:16px;font-weight:700;margin-top:2px}
.metric .s{font-size:11px;color:var(--dim);margin-top:1px}
/* 判定 */
.verdict{border-radius:8px;padding:14px 16px;font-size:16px;font-weight:700;margin-bottom:10px}
.verdict .reason{font-size:13px;font-weight:400;margin-top:4px;opacity:.9}
.verdict.buy{background:rgba(63,185,80,.12);border:1px solid var(--green);color:#7ee787}
.verdict.watch{background:rgba(210,153,34,.12);border:1px solid var(--yellow);color:#e3b341}
.verdict.avoid{background:rgba(248,81,73,.12);border:1px solid var(--red);color:#ff7b72}
/* 表格 */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--dim);font-weight:500;font-size:12px}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.code{color:var(--blue);cursor:pointer;font-weight:600}
tr:hover{background:var(--card2)}
.note{color:var(--dim);font-size:12px;margin-top:8px}
canvas{width:100%;display:block}
/* key 弹窗 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;width:92%;max-width:420px}
.modal-box h3{font-size:16px;margin-bottom:10px}
.modal-box p{font-size:13px;color:var(--dim);margin-bottom:12px}
.modal-box input{width:100%;margin-bottom:12px}
.modal-box .btn-row{display:flex;gap:8px;justify-content:flex-end}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<h1>📈 美股选股助手</h1>
<div class="sub">单股诊断 · 估值分析 · 实时行情（Finnhub 数据源）· 仅作研究参考，非投资建议</div>

<div class="toolbar">
  <input type="text" id="tickerInput" placeholder="输入美股代码，如 AAPL / TSLA / NVDA" onkeydown="if(event.key==='Enter')diag()">
  <button onclick="diag()">诊断</button>
  <select id="hotSelect" onchange="if(this.value){$('tickerInput').value=this.value;diag();}">
    <option value="">热门股▼</option>
    <option value="AAPL">苹果 AAPL</option>
    <option value="MSFT">微软 MSFT</option>
    <option value="GOOGL">谷歌 GOOGL</option>
    <option value="AMZN">亚马逊 AMZN</option>
    <option value="NVDA">英伟达 NVDA</option>
    <option value="META">Meta</option>
    <option value="TSLA">特斯拉 TSLA</option>
    <option value="NFLX">奈飞 NFLX</option>
    <option value="AMD">AMD</option>
    <option value="JPM">摩根大通 JPM</option>
    <option value="V">Visa</option>
    <option value="JNJ">强生 JNJ</option>
    <option value="LLY">礼来 LLY</option>
    <option value="XOM">埃克森美孚 XOM</option>
    <option value="WMT">沃尔玛 WMT</option>
  </select>
  <button class="sec" onclick="openKeyModal()">⚙️ API Key</button>
</div>

<div id="errBox" class="err hidden"></div>
<div id="diagLoading" class="loading hidden">诊断中…</div>

<div id="diagContent" class="hidden">
  <div class="card" id="quoteCard"></div>
  <div class="card">
    <h2><span class="ic">📊</span> K 线走势图（近 1 年日K）</h2>
    <canvas id="klineCanvas" height="300"></canvas>
  </div>
  <div class="card" id="profileCard"></div>
  <div class="card" id="valuationCard"></div>
  <div class="card" id="watchCard"></div>
</div>

<!-- API Key 弹窗 -->
<div id="keyModal" class="modal hidden">
  <div class="modal-box">
    <h3>设置 Finnhub API Key</h3>
    <p>免费注册 <b>finnhub.io</b>（邮箱即可）→ 登录后在 Dashboard 复制你的 API Key 粘贴到下面。Key 只保存在你本浏览器，不上传。</p>
    <input type="text" id="keyInput" placeholder="粘贴 Finnhub API Key（如 c1xxxxx）">
    <div class="btn-row">
      <button class="sec" onclick="closeKeyModal()">取消</button>
      <button onclick="saveKey()">保存</button>
    </div>
  </div>
</div>

<script>
/* ============ 工具 ============ */
const $ = id => document.getElementById(id);
const fmtNum = (n, d=2) => (n==null||isNaN(n)) ? '—' : Number(n).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:d});
const fmtBig = (n) => {
  if(n==null||isNaN(n)) return '—';
  const abs = Math.abs(n);
  if(abs>=1e12) return (n/1e12).toFixed(2)+' 万亿';
  if(abs>=1e9) return (n/1e9).toFixed(2)+' 十亿';
  if(abs>=1e6) return (n/1e6).toFixed(2)+' 百万';
  return fmtNum(n,0);
};
const pct = (n, signed=true) => (n==null||isNaN(n)) ? '—' : (signed&&n>0?'+':'')+Number(n).toFixed(2)+'%';

/* ============ API Key 管理 ============ */
const KEY_STORE = 'us_stock_finnhub_key';
function getKey(){ return localStorage.getItem(KEY_STORE)||''; }
function openKeyModal(){ $('keyInput').value = getKey(); $('keyModal').classList.remove('hidden'); }
function closeKeyModal(){ $('keyModal').classList.add('hidden'); }
function saveKey(){ const k=$('keyInput').value.trim(); if(k){ localStorage.setItem(KEY_STORE,k); closeKeyModal(); hideErr(); } else { alert('请输入 Key'); } }

/* ============ Finnhub API 封装 ============ */
const FH = 'https://finnhub.io/api/v1/';
async function fh(path){
  const key = getKey();
  if(!key) throw new Error('未设置 API Key，点右上「⚙️ API Key」填入 Finnhub 免费 key');
  const sep = path.includes('?') ? '&' : '?';
  const r = await fetch(FH+path+sep+'token='+encodeURIComponent(key), {cache:'no-store'});
  if(r.status===401) throw new Error('API Key 无效或已过期，请重新设置');
  if(r.status===403) throw new Error('该接口需要付费订阅，免费 key 不支持');
  if(r.status===429) throw new Error('请求太频繁（免费额度 60次/分钟），稍等再试');
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
async function fetchQuote(sym){ return fh('quote?symbol='+encodeURIComponent(sym)); }
async function fetchCandle(sym){
  const to = Math.floor(Date.now()/1000);
  const from = to - 370*24*3600; // 近1年
  return fh('stock/candle?symbol='+encodeURIComponent(sym)+'&resolution=D&from='+from+'&to='+to);
}
async function fetchProfile(sym){ return fh('stock/profile2?symbol='+encodeURIComponent(sym)); }
async function fetchMetric(sym){ return fh('stock/metric?symbol='+encodeURIComponent(sym)+'&metric=all'); }

/* ============ 主流程 ============ */
async function diag(){
  const sym = $('tickerInput').value.trim().toUpperCase();
  if(!sym){ showErr('请输入美股代码（如 AAPL）'); return; }
  hideErr();
  $('diagLoading').classList.remove('hidden');
  $('diagContent').classList.add('hidden');
  try{
    const [quote, candle, profile, metricObj] = await Promise.all([
      fetchQuote(sym), fetchCandle(sym), fetchProfile(sym), fetchMetric(sym)
    ]);
    const metric = metricObj.metric || {};
    const data = {sym, quote, candle, profile, metric};
    renderQuote(data);
    renderProfile(data);
    renderValuation(data);
    renderVerdict(data);
    renderWatch(data);
    drawKline($('klineCanvas'), candle);
    $('diagLoading').classList.add('hidden');
    $('diagContent').classList.remove('hidden');
  }catch(err){
    $('diagLoading').classList.add('hidden');
    showErr('诊断失败：'+err.message);
  }
}

/* ============ 行情概览 ============ */
function renderQuote(data){
  const {sym, quote, profile} = data;
  const c = quote.c, dp = quote.dp;
  const cls = dp>=0 ? 'up' : 'down';
  const sign = dp>0 ? '+' : '';
  const nm = (profile && profile.name) || sym;
  $('quoteCard').innerHTML = `
    <div class="q-head">
      <span class="q-name">${nm}</span>
      <span class="q-code">${sym}</span>
      <span class="q-price">$${fmtNum(c)}</span>
      <span class="q-chg ${cls}">${sign}${fmtNum(dp,2)}%</span>
    </div>
    <div class="q-meta">
      <span>昨收 <b>$${fmtNum(quote.pc)}</b></span>
      <span>今开 <b>$${fmtNum(quote.o)}</b></span>
      <span>最高 <b>$${fmtNum(quote.h)}</b></span>
      <span>最低 <b>$${fmtNum(quote.l)}</b></span>
      <span>涨跌额 <b class="${cls}">${quote.d!=null?(quote.d>0?'+':'')+fmtNum(quote.d,2):'—'}</b></span>
    </div>`;
}

/* ============ 公司概况 ============ */
function renderProfile(data){
  const p = data.profile || {};
  const items = [
    ['行业', p.finnhubIndustry||'—'],
    ['市值', p.marketCapitalization ? fmtBig(p.marketCapitalization*1e6) : '—'],
    ['交易所', p.exchange||'—'],
    ['上市日期', p.ipo||'—'],
    ['总部', p.country||'—'],
    ['流通股', p.shareOutstanding ? fmtBig(p.shareOutstanding*1e6) : '—'],
  ];
  const metric = data.metric;
  const hi = metric['52WeekHigh'], lo = metric['52WeekLow'];
  if(hi!=null) items.push(['52周高', '$'+fmtNum(hi)]);
  if(lo!=null) items.push(['52周低', '$'+fmtNum(lo)]);
  const grid = items.map(([k,v])=>`<div class="metric"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
  $('profileCard').innerHTML = `<h2><span class="ic">🏢</span> 公司概况</h2><div class="grid">${grid}</div>`;
}

/* ============ 估值指标 ============ */
function renderValuation(data){
  const m = data.metric;
  const rows = [
    ['市盈率 PE', m.peAnnual, null],
    ['市净率 PB', m.pbAnnual, null],
    ['市销率 PS', m.psTTM, null],
    ['ROE（净资产收益率）', m.roeTTM, '%'],
    ['ROA（总资产收益率）', m.roaTTM, '%'],
    ['毛利率', m.grossMarginTTM, '%'],
    ['净利率', m.netProfitMarginTTM, '%'],
    ['营收增速(同比)', m.revenueGrowthTTMYoy, '%'],
    ['净利增速(同比)', m.earningsGrowthTTMYoy, '%'],
    ['股息率', m.dividendYieldIndicatedAnnual, '%'],
    ['负债权益比', m.totalDebtToTotalEquityTTM||m.debtToEquityTTM, null],
    ['流动比率', m.currentRatioTTM, null],
    ['Beta', m.beta, null],
  ];
  const grid = rows.map(([k,v,unit])=>{
    const val = v==null ? '—' : (unit==='%' ? pct(v,false) : fmtNum(v,2));
    return `<div class="metric"><div class="k">${k}</div><div class="v">${val}</div></div>`;
  }).join('');
  $('valuationCard').innerHTML = `<h2><span class="ic">💰</span> 估值与盈利质量</h2><div class="grid">${grid}</div>
    <div class="note">PE/PB/PS 为年度口径，ROE/毛利率等为 TTM（滚动12个月）。数据源 Finnhub。</div>`;
}

/* ============ 综合判定 ============ */
function renderVerdict(data){
  const m = data.metric;
  const pe = m.peAnnual, roe = m.roeTTM, debt = m.totalDebtToTotalEquityTTM||m.debtToEquityTTM;
  const revG = m.revenueGrowthTTMYoy, epsG = m.earningsGrowthTTMYoy;
  const issues = [], goods = [];
  // 估值
  if(pe==null){ /* 无PE */ }
  else if(pe<0){ issues.push('亏损（PE为负）'); }
  else if(pe>60){ issues.push('PE '+fmtNum(pe,1)+' 偏高'); }
  else if(pe<=25){ goods.push('PE '+fmtNum(pe,1)+' 估值不贵'); }
  // 盈利质量
  if(roe!=null){
    if(roe<0) issues.push('ROE 为负');
    else if(roe>=15) goods.push('ROE '+fmtNum(roe,1)+'% 盈利能力强');
  }
  // 负债
  if(debt!=null && debt>2) issues.push('负债权益比 '+fmtNum(debt,1)+' 偏高');
  // 成长
  if(epsG!=null && epsG<0) issues.push('净利增速 '+pct(epsG)+' 下滑');
  else if(epsG!=null && epsG>=20) goods.push('净利增速 '+pct(epsG)+' 成长性好');
  if(revG!=null && revG<0) issues.push('营收增速 '+pct(revG)+' 下滑');

  let cls, label, reason;
  if(issues.length>=3){ cls='avoid'; label='❌ 谨慎'; reason=issues.join('；'); }
  else if(issues.length>=1){ cls='watch'; label='⚠️ 观察'; reason=issues.join('；')+(goods.length?'；亮点：'+goods.join('，'):''); }
  else { cls='buy'; label='✅ 基本面健康'; reason=goods.length?goods.join('；'):'核心指标未见明显风险'; }

  // 塞到 quoteCard 下方独立卡片
  let vc = $('verdictCard');
  if(!vc){ vc = document.createElement('div'); vc.id='verdictCard'; vc.className='card'; $('quoteCard').after(vc); }
  vc.innerHTML = `<h2><span class="ic">🎯</span> 综合判定</h2><div class="verdict ${cls}">${label}<div class="reason">${reason}</div></div>
    <div class="note">注：以上仅为财务指标层面的机械提示，不构成买卖建议。行业前景、管理层、宏观环境需你自行判断。</div>`;
}

/* ============ 关注点提醒 ============ */
function renderWatch(data){
  const m = data.metric;
  const c = data.quote.c;
  const hi = m['52WeekHigh'], lo = m['52WeekLow'];
  const tips = [];
  if(hi!=null && c!=null){
    const off = (c/hi-1)*100;
    if(off>-5) tips.push('现价距 52 周高点仅 '+pct(off)+'，接近高位');
    if(off<-30) tips.push('现价较 52 周高点回落 '+fmtNum(Math.abs(off),0)+'%，深度回调');
  }
  if(m.dividendYieldIndicatedAnnual!=null && m.dividendYieldIndicatedAnnual>3) tips.push('股息率 '+pct(m.dividendYieldIndicatedAnnual,false)+'，属高股息');
  if(m.beta!=null){
    if(m.beta>1.5) tips.push('Beta '+fmtNum(m.beta,1)+'，波动大于大盘');
    if(m.beta<0.8) tips.push('Beta '+fmtNum(m.beta,1)+'，波动小于大盘');
  }
  if(!tips.length) tips.push('暂无特别提醒');
  $('watchCard').innerHTML = `<h2><span class="ic">👀</span> 关注点</h2>` + tips.map(t=>`<div class="note">· ${t}</div>`).join('');
}

/* ============ K线图（红涨绿跌，沿用A股习惯） ============ */
function drawKline(canvas, candle){
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth||800, h = 300;
  canvas.width = w*dpr; canvas.height = h*dpr;
  canvas.style.height = h+'px';
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  if(!candle || candle.s!=='ok' || !(candle.t||[]).length){
    ctx.fillStyle='#8b949e'; ctx.font='13px sans-serif'; ctx.fillText('无K线数据', w/2-40, h/2); return;
  }
  const n = candle.t.length;
  const klines = candle.t.map((t,i)=>({t, o:candle.o[i], h:candle.h[i], l:candle.l[i], c:candle.c[i], v:candle.v[i]}));
  const pad={l:10,r:56,t:10,b:22}, pw=w-pad.l-pad.r, ph=h-pad.t-pad.b;
  const max=Math.max(...klines.map(k=>k.h)), min=Math.min(...klines.map(k=>k.l));
  const range=max-min||1;
  const cw=pw/n, bw=Math.max(cw*0.7,1);
  const y=v=>pad.t+(max-v)/range*ph;
  // 网格+价格
  ctx.strokeStyle='#2d333b'; ctx.fillStyle='#8b949e'; ctx.font='10px sans-serif'; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){ const p=max-range*i/4, yy=y(p); ctx.beginPath(); ctx.moveTo(pad.l,yy); ctx.lineTo(w-pad.r,yy); ctx.stroke(); ctx.fillText(p.toFixed(1), w-pad.r+4, yy+3); }
  // K线
  klines.forEach((k,i)=>{
    const x=pad.l+i*cw+cw/2;
    const up=k.c>=k.o;
    ctx.strokeStyle=up?'#ff4d4f':'#00c48c'; ctx.fillStyle=up?'#ff4d4f':'#00c48c';
    ctx.beginPath(); ctx.moveTo(x,y(k.h)); ctx.lineTo(x,y(k.l)); ctx.stroke();
    const yo=y(k.o), yc=y(k.c), top=Math.min(yo,yc), bh=Math.max(Math.abs(yo-yc),1);
    ctx.fillRect(x-bw/2, top, bw, bh);
  });
  // MA5/10/20
  const ma=period=>{ const arr=[]; for(let i=period-1;i<n;i++){ const s=klines.slice(i-period+1,i+1).reduce((a,k)=>a+k.c,0)/period; arr.push({i,x:pad.l+i*cw+cw/2,v:s}); } return arr; };
  [['MA5',5,'#e6c07b'],['MA10',10,'#58a6ff'],['MA20',20,'#bc8cff']].forEach(([nm,p,color])=>{
    const pts=ma(p); if(!pts.length) return;
    ctx.strokeStyle=color; ctx.lineWidth=1; ctx.beginPath();
    pts.forEach((pt,idx)=>{ const yy=y(pt.v); idx===0?ctx.moveTo(pt.x,yy):ctx.lineTo(pt.x,yy); }); ctx.stroke();
  });
  ctx.fillStyle='#e6c07b'; ctx.fillText('MA5', pad.l, 14);
  ctx.fillStyle='#58a6ff'; ctx.fillText('MA10', pad.l+36, 14);
  ctx.fillStyle='#bc8cff'; ctx.fillText('MA20', pad.l+72, 14);
}

/* ============ 错误 ============ */
function showErr(msg){ const e=$('errBox'); e.textContent=msg; e.classList.remove('hidden'); }
function hideErr(){ $('errBox').classList.add('hidden'); }

/* ============ 初始化 ============ */
(function(){
  if(!getKey()){
    showErr('首次使用：点右上「⚙️ API Key」填入 Finnhub 免费 key（finnhub.io 注册即得）。');
  }
})();
</script>
</body>
</html>
