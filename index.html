<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美股选股助手 · 免费数据源</title>
<style>
:root{
  --bg:#0e1117; --card:#161b22; --card2:#1c2128; --border:#2d333b;
  --txt:#e6edf3; --dim:#8b949e; --green:#3fb950; --red:#f85149; --yellow:#d29922; --blue:#58a6ff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px;max-width:1180px;margin:0 auto;line-height:1.5}
h1{font-size:20px;margin-bottom:4px}
.sub{color:var(--dim);font-size:13px;margin-bottom:14px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
button{background:#1f6feb;color:#fff;border:none;padding:8px 14px;border-radius:6px;font-size:13px;cursor:pointer;font-weight:600}
button:hover{filter:brightness(1.1)}
button.sec{background:var(--card2);border:1px solid var(--border);color:var(--txt);font-weight:400}
button.on{background:#1f6feb;color:#fff;border-color:#1f6feb}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin-bottom:12px}
.card h2 .ic{margin-right:6px}
.hidden{display:none}
.err{background:rgba(218,54,51,.15);border:1px solid #da3633;color:#ff7b72;padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13px}
.loading{color:var(--dim);font-size:13px;padding:20px 0;text-align:center}
.up{color:var(--red)} .down{color:var(--green)}
/* 筛选栏 */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters label{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:4px}
.filters input{width:56px;background:var(--card2);border:1px solid var(--border);color:var(--txt);padding:6px 8px;border-radius:6px;font-size:13px}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.preset{font-size:12px;padding:5px 12px}
/* 表格 */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--border)}
th{color:var(--dim);font-weight:500;font-size:12px;cursor:pointer;user-select:none}
th:hover{color:var(--txt)}
th.sorted{color:var(--blue)}
th:first-child,td:first-child{text-align:left}
td.num{font-variant-numeric:tabular-nums}
td.code{color:var(--blue);cursor:pointer;font-weight:600;text-align:left}
td.name{text-align:left;color:var(--txt)}
tr:hover{background:var(--card2)}
tr.selected{background:rgba(88,166,255,.08)}
.note{color:var(--dim);font-size:12px;margin-top:8px}
canvas{width:100%;display:block}
/* 详情 */
.detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.metric{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.metric .k{color:var(--dim);font-size:12px}
.metric .v{font-size:16px;font-weight:700;margin-top:2px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--card2);border:1px solid var(--border);margin-left:6px;color:var(--dim)}
</style>
</head>
<body>
<h1>📈 美股选股助手</h1>
<div class="sub">免费数据源（Yahoo Finance，经 GitHub Actions 定时抓取）· 每 15 分钟更新 · 仅作研究参考，非投资建议</div>

<div class="toolbar">
  <span id="updatedAt" class="note" style="margin:0"></span>
  <button class="sec" onclick="loadData()">🔄 刷新</button>
</div>

<div id="errBox" class="err hidden"></div>
<div id="loading" class="loading">加载数据中…</div>

<div id="mainContent" class="hidden">
  <!-- 预设选股策略 -->
  <div class="presets">
    <button class="preset" onclick="preset('value')">💎 价值股（PE<20 & ROE>15%）</button>
    <button class="preset" onclick="preset('growth')">🚀 成长股（营收&净利增速>15%）</button>
    <button class="preset" onclick="preset('dividend')">💰 高股息（股息率>3%）</button>
    <button class="preset" onclick="preset('quality')">🏆 优质（ROE>20% & 毛利率>50%）</button>
    <button class="preset" onclick="preset('all')">全部</button>
  </div>

  <!-- 自定义筛选 -->
  <div class="filters">
    <label>PE ≤ <input id="fPe" type="number" placeholder="—"></label>
    <label>ROE ≥ <input id="fRoe" type="number" placeholder="—">%</label>
    <label>营收增速 ≥ <input id="fRev" type="number" placeholder="—">%</label>
    <label>股息率 ≥ <input id="fDiv" type="number" placeholder="—">%</label>
    <button onclick="applyFilter()">应用筛选</button>
    <button class="sec" onclick="clearFilter()">清除</button>
  </div>

  <div class="card">
    <h2><span class="ic">📋</span> 股票池 <span id="countBadge" class="badge"></span></h2>
    <div class="tablewrap">
      <table id="stockTable">
        <thead>
          <tr>
            <th onclick="sortBy('symbol')">代码</th>
            <th onclick="sortBy('name')">名称</th>
            <th onclick="sortBy('price')">现价</th>
            <th onclick="sortBy('chgPct')">涨跌</th>
            <th onclick="sortBy('pe')">PE</th>
            <th onclick="sortBy('roe')">ROE</th>
            <th onclick="sortBy('revGrowth')">营收增速</th>
            <th onclick="sortBy('grossMargin')">毛利率</th>
            <th onclick="sortBy('dividendYield')">股息率</th>
            <th onclick="sortBy('marketCap')">市值</th>
            <th onclick="sortBy('sector')">行业</th>
          </tr>
        </thead>
        <tbody id="stockBody"></tbody>
      </table>
    </div>
    <div class="note">点击代码查看详情（K线 + 完整指标）。红涨绿跌。数据每 15 分钟刷新。</div>
  </div>

  <!-- 单股详情 -->
  <div id="detailCard" class="card hidden">
    <h2 id="detailTitle"></h2>
    <div class="detail-grid" id="detailGrid"></div>
    <div style="margin-top:12px">
      <h2 style="font-size:14px;margin-bottom:8px">📊 近 90 个交易日 K 线</h2>
      <canvas id="klineCanvas" height="300"></canvas>
    </div>
  </div>
</div>

<script>
/* ============ 状态 ============ */
let ALL = [];          // 全量数据
let FILTERED = [];     // 筛选后
let sortKey = 'marketCap';
let sortDesc = true;
let currentSym = null;

const $ = id => document.getElementById(id);
const fmtNum = (n, d=2) => (n==null||isNaN(n)) ? '—' : Number(n).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:d});
const fmtBig = (n) => {
  if(n==null||isNaN(n)) return '—';
  const abs=Math.abs(n);
  if(abs>=1e12) return (n/1e12).toFixed(2)+'万亿';
  if(abs>=1e9) return (n/1e9).toFixed(2)+'0亿';
  if(abs>=1e6) return (n/1e6).toFixed(1)+'百万';
  return fmtNum(n,0);
};
const pct = (n, signed=false) => (n==null||isNaN(n)) ? '—' : (signed&&n>0?'+':'')+Number(n).toFixed(2)+'%';

/* ============ 数据加载 ============ */
const DATA_URL = 'https://raw.githubusercontent.com/letu131419/us-stock-picker/main/data/stocks.json';
async function loadData(){
  hideErr();
  $('loading').classList.remove('hidden');
  $('mainContent').classList.add('hidden');
  try{
    const r = await fetch(DATA_URL+'?t='+Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    ALL = (d.stocks||[]).filter(s=>!s.error && !s.chart_err && s.price!=null);
    if(!ALL.length) throw new Error('数据为空，可能抓取脚本尚未首次运行');
    // 更新时间
    const ts = d.updatedAt ? new Date(d.updatedAt*1000) : null;
    $('updatedAt').textContent = ts ? ('数据更新于 ' + ts.toLocaleString('zh-CN',{hour12:false})) : '';
    FILTERED = [...ALL];
    applySort();
    $('loading').classList.add('hidden');
    $('mainContent').classList.remove('hidden');
  }catch(err){
    $('loading').classList.add('hidden');
    showErr('加载失败：'+err.message+'（可能是首次运行，数据尚未生成，等 Actions 跑一次后刷新）');
  }
}

/* ============ 筛选 ============ */
function preset(type){
  clearFilter();
  const f = {pe:Infinity, roe:-Infinity, rev:-Infinity, div:-Infinity};
  if(type==='value'){ f.pe=20; f.roe=15; }
  else if(type==='growth'){ f.rev=15; }
  else if(type==='dividend'){ f.div=3; }
  else if(type==='quality'){ f.roe=20; }
  applyFilter(f);
}
function applyFilter(presetFilter){
  const f = presetFilter || {
    pe: parseFloat($('fPe').value) || Infinity,
    roe: parseFloat($('fRoe').value) || -Infinity,
    rev: parseFloat($('fRev').value) || -Infinity,
    div: parseFloat($('fDiv').value) || -Infinity,
  };
  FILTERED = ALL.filter(s=>{
    if(s.pe!=null && s.pe>f.pe) return false;
    if(s.roe!=null && s.roe<f.roe) return false;
    if(s.revGrowth!=null && s.revGrowth<f.rev) return false;
    if(s.dividendYield!=null && s.dividendYield<f.div) return false;
    return true;
  });
  applySort();
}
function clearFilter(){
  $('fPe').value=''; $('fRoe').value=''; $('fRev').value=''; $('fDiv').value='';
  FILTERED = [...ALL];
  applySort();
}

/* ============ 排序 ============ */
function sortBy(key){
  if(sortKey===key) sortDesc=!sortDesc;
  else { sortKey=key; sortDesc=true; }
  applySort();
}
function applySort(){
  FILTERED.sort((a,b)=>{
    let va=a[sortKey], vb=b[sortKey];
    if(va==null && vb==null) return 0;
    if(va==null) return 1;
    if(vb==null) return -1;
    if(typeof va==='string') return sortDesc ? vb.localeCompare(va) : va.localeCompare(vb);
    return sortDesc ? vb-va : va-vb;
  });
  renderTable();
}

/* ============ 渲染表格 ============ */
function renderTable(){
  $('countBadge').textContent = FILTERED.length+' / '+ALL.length+' 只';
  const rows = FILTERED.map(s=>{
    const chgCls = (s.chgPct||0)>=0 ? 'up' : 'down';
    const chgSign = (s.chgPct||0)>0 ? '+' : '';
    return `<tr data-sym="${s.symbol}" onclick="selectRow('${s.symbol}',this)">
      <td class="code">${s.symbol}</td>
      <td class="name">${s.name||''}</td>
      <td class="num">$${fmtNum(s.price)}</td>
      <td class="num ${chgCls}">${chgSign}${fmtNum(s.chgPct,2)}%</td>
      <td class="num">${fmtNum(s.pe,1)}</td>
      <td class="num">${s.roe!=null?fmtNum(s.roe,1)+'%':'—'}</td>
      <td class="num">${pct(s.revGrowth,true)}</td>
      <td class="num">${s.grossMargin!=null?fmtNum(s.grossMargin,1)+'%':'—'}</td>
      <td class="num">${s.dividendYield!=null?fmtNum(s.dividendYield,2)+'%':'—'}</td>
      <td class="num">${fmtBig(s.marketCap)}</td>
      <td class="name" style="color:var(--dim)">${s.sector||'—'}</td>
    </tr>`;
  }).join('');
  $('stockBody').innerHTML = rows || '<tr><td colspan="11" style="text-align:center;color:var(--dim)">无符合条件</td></tr>';
}

/* ============ 单股详情 ============ */
function selectRow(sym, tr){
  currentSym = sym;
  document.querySelectorAll('#stockBody tr').forEach(r=>r.classList.remove('selected'));
  if(tr) tr.classList.add('selected');
  const s = ALL.find(x=>x.symbol===sym);
  if(!s) return;
  $('detailCard').classList.remove('hidden');
  $('detailTitle').innerHTML = `<span class="ic">🏢</span> ${s.name||s.symbol} <span style="color:var(--dim);font-size:13px">${s.symbol}</span> <span class="badge">${s.sector||''}</span><span class="badge">${s.industry||''}</span>`;
  const chgCls = (s.chgPct||0)>=0?'up':'down';
  const items = [
    ['现价', '$'+fmtNum(s.price)], ['涨跌幅', pct(s.chgPct,true)],
    ['市盈率 PE', fmtNum(s.pe,1)], ['前瞻PE', fmtNum(s.forwardPE,1)],
    ['市净率 PB', fmtNum(s.pb,1)], ['PEG', fmtNum(s.peg,2)],
    ['ROE', s.roe!=null?fmtNum(s.roe,1)+'%':'—'], ['ROA', s.roa!=null?fmtNum(s.roa,1)+'%':'—'],
    ['毛利率', s.grossMargin!=null?fmtNum(s.grossMargin,1)+'%':'—'], ['净利率', s.netMargin!=null?fmtNum(s.netMargin,1)+'%':'—'],
    ['营收增速', pct(s.revGrowth,true)], ['净利增速', pct(s.epsGrowth,true)],
    ['股息率', s.dividendYield!=null?fmtNum(s.dividendYield,2)+'%':'—'], ['Beta', fmtNum(s.beta,2)],
    ['负债权益比', fmtNum(s.debtToEquity,1)], ['流动比率', fmtNum(s.currentRatio,2)],
    ['市值', fmtBig(s.marketCap)], ['52周高', '$'+fmtNum(s.high52)], ['52周低', '$'+fmtNum(s.low52)],
  ];
  $('detailGrid').innerHTML = items.map(([k,v])=>`<div class="metric"><div class="k">${k}</div><div class="v ${k==='涨跌幅'?chgCls:''}">${v}</div></div>`).join('');
  drawKline($('klineCanvas'), s.klines||[]);
  $('detailCard').scrollIntoView({behavior:'smooth', block:'start'});
}

/* ============ K线图 ============ */
function drawKline(canvas, klines){
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth||800, h = 300;
  canvas.width = w*dpr; canvas.height = h*dpr;
  canvas.style.height = h+'px';
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  if(!klines || !klines.length){ ctx.fillStyle='#8b949e'; ctx.font='13px sans-serif'; ctx.fillText('无K线数据', w/2-40, h/2); return; }
  const n = klines.length;
  const pad={l:10,r:56,t:10,b:22}, pw=w-pad.l-pad.r, ph=h-pad.t-pad.b;
  const max=Math.max(...klines.map(k=>k.h??-Infinity)), min=Math.min(...klines.map(k=>k.l??Infinity));
  const range=max-min||1;
  const cw=pw/n, bw=Math.max(cw*0.7,1);
  const y=v=>pad.t+(max-v)/range*ph;
  ctx.strokeStyle='#2d333b'; ctx.fillStyle='#8b949e'; ctx.font='10px sans-serif'; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){ const p=max-range*i/4, yy=y(p); ctx.beginPath(); ctx.moveTo(pad.l,yy); ctx.lineTo(w-pad.r,yy); ctx.stroke(); ctx.fillText(p.toFixed(1), w-pad.r+4, yy+3); }
  klines.forEach((k,i)=>{
    if(k.o==null||k.c==null) return;
    const x=pad.l+i*cw+cw/2;
    const up=k.c>=k.o;
    ctx.strokeStyle=up?'#ff4d4f':'#00c48c'; ctx.fillStyle=up?'#ff4d4f':'#00c48c';
    ctx.beginPath(); ctx.moveTo(x,y(k.h)); ctx.lineTo(x,y(k.l)); ctx.stroke();
    const yo=y(k.o), yc=y(k.c), top=Math.min(yo,yc), bh=Math.max(Math.abs(yo-yc),1);
    ctx.fillRect(x-bw/2, top, bw, bh);
  });
  const ma=period=>{ const arr=[]; for(let i=period-1;i<n;i++){ const seg=klines.slice(i-period+1,i+1).filter(k=>k.c!=null); if(seg.length!==period) continue; const s=seg.reduce((a,k)=>a+k.c,0)/period; arr.push({i,x:pad.l+i*cw+cw/2,v:s}); } return arr; };
  [['MA5',5,'#e6c07b'],['MA10',10,'#58a6ff'],['MA20',20,'#bc8cff']].forEach(([nm,p,color])=>{
    const pts=ma(p); if(!pts.length) return;
    ctx.strokeStyle=color; ctx.lineWidth=1; ctx.beginPath();
    pts.forEach((pt,idx)=>{ const yy=y(pt.v); idx===0?ctx.moveTo(pt.x,yy):ctx.lineTo(pt.x,yy); }); ctx.stroke();
  });
  ctx.fillStyle='#e6c07b'; ctx.fillText('MA5', pad.l, 14);
  ctx.fillStyle='#58a6ff'; ctx.fillText('MA10', pad.l+36, 14);
  ctx.fillStyle='#bc8cff'; ctx.fillText('MA20', pad.l+72, 14);
}

function showErr(msg){ const e=$('errBox'); e.textContent=msg; e.classList.remove('hidden'); }
function hideErr(){ $('errBox').classList.add('hidden'); }

/* ============ 初始化 ============ */
loadData();
</script>
</body>
</html>
